name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: CGS1 root-owned Store and Linux IPC fixtures
        # This fixture intentionally exercises the production root-only Store
        # contract. Run it explicitly on the disposable hosted runner, rather
        # than weakening ownership checks or asking local developers for sudo.
        # Disabled replacement QA rewrites every path into an isolated tree;
        # no production launcher, firmware program or device is executed.
        run: sudo --preserve-env=LD_LIBRARY_PATH,PKG_CONFIG_PATH -- "$(command -v python)" -m unittest discover -s tests -p 'test_monitor1*.py' -v
      - run: python -m compileall -q custom_components tools
      - run: node --check custom_components/qingping_esphome/frontend/panel.js
      - run: node tests/test_compatibility.mjs
      - run: node tests/test_i18n.mjs
      - run: node tests/test_ha_transport.mjs
      - run: node tests/test_sidebar_settings.mjs
      - run: node tests/test_usb_probe.mjs
      - run: node tests/test_usb_native_channel.mjs
      - run: node tests/test_usb_companion.mjs
      - run: node tests/test_monitor1_core_frontend.mjs
      - run: node tests/test_monitor1_core_child.mjs
      - run: python tools/monitor1-usb/package_core.py --check
      - run: python tools/monitor1-usb/generate_contract.py --check
      - name: MCU 4.2.1 receive-only parser (no hardware)
        run: |
          mkdir -p .build
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_mcu421.cpp -o .build/test_mcu421
          .build/test_mcu421
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  lite-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r ports/lite/requirements.txt
      # Public placeholders only; this is compile/crypto interoperability QA,
      # never an installation or publication of a personalised device image.
      - run: python tools/build_lite.py
      - run: python tools/check_profile_wire.py
  ha-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha_version: ['2026.10.2', '2026.11.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install homeassistant==${{ matrix.ha_version }}
      - name: Install the selected HA SDK's Bluetooth, USB and ESPHome requirements
        # Core does not install every integration dependency. Resolve these
        # from this exact SDK rather than pinning a different Bluetooth stack.
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, subprocess, sys
          root = pathlib.Path(importlib.util.find_spec("homeassistant").origin).parent
          requirements = []
          for domain in ("bluetooth", "usb", "hassio", "esphome", "assist_satellite", "assist_pipeline", "conversation", "tts", "ffmpeg"):
              requirements.extend(json.loads((root / "components" / domain / "manifest.json").read_text()).get("requirements", []))
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - run: python -m unittest discover -s tests -v
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  usb-companion:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-qemu-action@v3
      - name: Verify offline browser bundle reproducibility
        run: |
          npm ci --prefix tools/monitor1-usb --ignore-scripts --no-audit --no-fund
          node tools/monitor1-usb/build.mjs
          python3 tools/monitor1-usb/package_core.py --check
          git diff --exit-code -- custom_components/qingping_esphome/frontend/usb-probe-bundle.mjs custom_components/qingping_esphome/frontend/usb-probe-NOTICES.txt apps/monitor1_usb/rootfs/static/usb-probe-bundle.mjs apps/monitor1_usb/rootfs/static/usb-probe-NOTICES.txt
      - name: Build the experimental USB companion
        # Build/run only on the disposable hosted runner. No USB mapping,
        # device, HA connection, image publication or local Mac VM is used.
        run: docker build --platform linux/${{ matrix.architecture }} -t qingping-usb-ci apps/monitor1_usb
      - name: Check pinned build SDK in the actual app image
        # Public requirements and a synthetic C program only. Run on the
        # disposable CI runner with one CPU/2GiB, never a Mac VM or monitor.
        run: |
          docker run --rm --platform linux/${{ matrix.architecture }} --cpus=1 --memory=2g \
            -v "$PWD/ports/monitor1/requirements.txt:/public-requirements.txt:ro" \
            -v "$PWD/tools/monitor1-usb/check_build_environment.py:/check-build.py:ro" \
            qingping-usb-ci python3 /check-build.py
      - name: Verify real container startup and ingress refusal
        run: |
          docker run -d --platform linux/${{ matrix.architecture }} --name qingping-usb-ci --network none --tmpfs /data qingping-usb-ci
          trap 'docker rm -f qingping-usb-ci >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if docker exec qingping-usb-ci python3 -c 'import urllib.request, urllib.error; r=urllib.request.urlopen("http://127.0.0.1:8099/")' >/dev/null 2>&1; then
              echo 'Unauthenticated local access unexpectedly succeeded'; exit 1
            fi
            if docker exec qingping-usb-ci python3 -c 'import urllib.request, urllib.error
          try: urllib.request.urlopen("http://127.0.0.1:8099/")
          except urllib.error.HTTPError as error:
              assert error.code == 403
              raise SystemExit(0)
          raise SystemExit(1)' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          exit 1

name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - name: CGS1 root-owned Store and Linux IPC fixtures
        # This fixture intentionally exercises the production root-only Store
        # contract. Run it explicitly on the disposable hosted runner, rather
        # than weakening ownership checks or asking local developers for sudo.
        run: sudo --preserve-env=LD_LIBRARY_PATH,PKG_CONFIG_PATH -- "$(command -v python)" -m unittest discover -s tests -p test_monitor1.py -v
      - run: python -m compileall -q custom_components tools
      - run: node --check custom_components/qingping_esphome/frontend/panel.js
      - run: node tests/test_compatibility.mjs
      - run: node tests/test_i18n.mjs
      - name: MCU 4.2.1 receive-only parser (no hardware)
        run: |
          mkdir -p .build
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_mcu421.cpp -o .build/test_mcu421
          .build/test_mcu421
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  ha-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha_version: ['2026.10.2', '2026.11.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install homeassistant==${{ matrix.ha_version }}
      - run: python -m unittest discover -s tests -v
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

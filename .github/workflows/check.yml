name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components tools
      - run: node --check custom_components/qingping_esphome/frontend/panel.js
      - run: node tests/test_compatibility.mjs
      - run: node tests/test_i18n.mjs
      - run: node tests/test_ha_transport.mjs
      - name: MCU 4.2.1 receive-only parser (no hardware)
        run: |
          mkdir -p .build
          c++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_mcu421.cpp -o .build/test_mcu421
          .build/test_mcu421
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  ha-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha_version: ['2026.10.2', '2026.11.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install homeassistant==${{ matrix.ha_version }}
      - name: Install the selected HA SDK's Bluetooth and USB requirements
        # Core does not install every integration dependency. Resolve these
        # from this exact SDK rather than pinning a different Bluetooth stack.
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, subprocess, sys
          root = pathlib.Path(importlib.util.find_spec("homeassistant").origin).parent
          requirements = []
          for domain in ("bluetooth", "usb", "hassio"):
              requirements.extend(json.loads((root / "components" / domain / "manifest.json").read_text())["requirements"])
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - run: python -m unittest discover -s tests -v
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

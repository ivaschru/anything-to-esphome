name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r ports/lite/requirements.txt
      - run: python tools/build_lite.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: qingping-esphome
          path: .build/qingping_esphome.zip
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/qingping_esphome.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease

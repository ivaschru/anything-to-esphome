name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r ports/lite/requirements.txt
      # Installer-only updates keep the exact tested public firmware. A
      # known source change still uses the pinned public-placeholder compiler;
      # dirty/missing source or failed download never selects another image.
      - run: python tools/prepare_release_template.py
      - run: python tools/prepare_release_template.py --profile lite-434
      # Separate SDK: changing Sonoff must never change the frozen Lite image.
      - name: Prepare the S60TPF public template
        run: |
          python -m venv .build/sonoff-venv
          .build/sonoff-venv/bin/pip install -r ports/sonoff_s60/requirements.txt
          .build/sonoff-venv/bin/python tools/build_sonoff.py --reuse-published
      - name: Verify sealed profile across the actual C++ and Python implementations
        # The initial capability build supplies the exact SDK source tree.
        # Installer-only releases reuse the already-verified immutable pair.
        run: |
          if [ -f .build/lite-app/build/compile_commands.json ]; then
            python tools/check_profile_wire.py
          fi
          if [ -f .build/lite434-app/build/compile_commands.json ]; then
            python tools/check_lite434_wire.py
          fi
      - run: python -m unittest discover -s tests -v
      - run: python tools/package_release.py
      # Frozen compatibility feed for installed pre-0.2.2 readers only. The
      # independent firmware workflow owns the live catalog and firmware tags.
      - run: python tools/legacy_catalog.py
      - uses: actions/upload-artifact@v4
        with:
          name: anything-to-esphome
          path: |
            .build/qingping_esphome.zip
            .build/legacy-feed/firmware-catalog.json
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Never replace bytes of an already published version. A maintainer
        # may have uploaded the locally audited initial beta before this CI
        # build completes; that version remains immutable.
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # HACS ignores prereleases unless the user opts in. Stable tags
            # must therefore publish a normal release with the required ZIP,
            # rather than falling back to a non-existent /download/main URL.
            case "$GITHUB_REF_NAME" in
              *-*) prerelease=true ;;
              *) prerelease=false ;;
            esac
            assets=(.build/qingping_esphome.zip)
            if [ "$prerelease" = false ]; then
              assets+=(".build/legacy-feed/firmware-catalog.json")
            fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease="$prerelease"
          fi

name: Monitor 1 Core environment probe
on:
  pull_request:
    paths:
      - '.github/workflows/monitor1-core-probe.yml'
      - 'tools/monitor1-usb/check_core_environment.py'
      - 'ports/monitor1/requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-environment:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check disposable runner disk budget
        run: test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 6291456
      - name: Probe the unchanged official Core image
        # No HA server is started. No /config, /dev, credentials, Docker
        # socket or host network is passed into the container. This probes
        # public SDK compatibility, never an installation or USB connection.
        run: |
          mkdir -m 700 core-probe-work core-probe-result
          docker run --rm --entrypoint python3 --read-only \
            --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --cpus=1 --memory=2g --pids-limit=128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -v "$PWD/core-probe-work:/probe-work" \
            -v "$PWD/core-probe-result:/probe-result" \
            -v "$PWD/ports/monitor1/requirements.txt:/public-requirements.txt:ro" \
            -v "$PWD/tools/monitor1-usb/check_core_environment.py:/probe.py:ro" \
            ghcr.io/home-assistant/${{ matrix.architecture }}-homeassistant:2026.11.0 /probe.py
      - name: Retain only the public capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-environment-${{ matrix.architecture }}
          path: core-probe-result/environment.json
          if-no-files-found: warn
          retention-days: 7

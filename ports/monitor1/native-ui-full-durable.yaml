# Explicit engineering profile: own ext4 preferences + ordinary thermal state.
# It still needs the sealed-plan/two-guardian runner; it is not an installer.
# Apply prepare_host_checked_preferences.py --apply in the pinned venv first.
packages:
  full: !include native-ui-full.yaml
substitutions:
  durable_full_state: "true"
esphome:
  build_path: build/qingping-cgs1-full-native-durable
  platformio_options:
    build_flags:
      - -DUSE_CGS1_CHECKED_RAM_PREFERENCES

# Full-runtime maintenance bridge candidate. Keeps legacy MAC/API/Noise OTA
# and all stock sensor/entity IDs. Generate the TWO exact image fingerprints
# before compiling; a successful build is not permission/evidence of takeover.
packages:
  stock: !include stock-bridge-network.yaml
  full_api: !include full-runtime-api.yaml
esphome:
  build_path: build/stock-bridge-full
cgs1_maintenance:
  # The older shell-guard trial cannot race this coordinator for the board.
  allow_network_trial: false
cgs1_full_runtime:
  id: full_runtime
  api_id: bridge_api
  ota_id: bridge_ota
  artifacts: !include build/full-runtime-manifest.yaml

# Read-only capacity/inventory on the ordinary stock-side full coordinator.
# It stays after an update, so future low-space checks need no temporary
# recovery image. No prune action or arbitrary path is exposed here.
esphome:
  includes:
    - network_preflight.h
    - storage_audit.h
    - storage_release_prune.h
api:
  actions:
    - action: storage_audit
      supports_response: only
      then:
        - api.respond:
            data: !lambda cgs1_storage::audit(root);

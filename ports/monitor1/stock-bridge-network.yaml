# First network maintenance release: keeps the existing device/API/OTA identity
# and stock acquisition/display. It adds RAM artifact staging only, no launch
# or shell action. Generate the exact manifest before compiling this config.
packages:
  stock: !include stock-bridge.yaml
  maintenance_api: !include network-maintenance-api.yaml
esphome:
  build_path: build/stock-bridge-network
external_components:
  - source:
      type: local
      path: components
    components: [cgs1_maintenance]
cgs1_maintenance:
  id: maintenance
  artifacts: !include build/native-trial-manifest.yaml

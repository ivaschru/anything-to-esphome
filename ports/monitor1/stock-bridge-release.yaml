# Build-only production candidate. FullRuntime retains the same compiled pair,
# strict board admission, dual guardians and transport lifecycle. The historical
# network trial API is deliberately not part of this production configuration;
# it cannot require an unrelated trial image or a fabricated legacy manifest.
packages:
  stock: !include stock-bridge.yaml
  full_api: !include full-runtime-api.yaml
  storage_telemetry: !include storage-telemetry.yaml
esphome:
  build_path: build/stock-bridge-release
cgs1_full_runtime:
  id: full_runtime
  api_id: bridge_api
  ota_id: bridge_ota
  core_release_autostart: true
  recover_original_network_after_return: false
  # No default pins. The builder writes this only after both exact programs
  # have been built and validated. An incomplete source checkout fails closed.
  artifacts: !include build/release-runtime-manifest.yaml

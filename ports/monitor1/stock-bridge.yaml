# CGS1 coexistence prototype. The real screen and sensor acquisition stay in
# SnowApp. Do not reuse this configuration for CGDN1 or an unverified CGS2.
packages:
  power: !include power-telemetry.yaml
  release: !include host-release-optimization.yaml
substitutions:
  cgs1_node_name: qingping-cgs1-stock-bridge
  cgs1_friendly_name: Qingping CGS1 Stock Bridge
  cgs1_api_mac: "02:00:00:00:00:01"
esphome:
  name: ${cgs1_node_name}
  friendly_name: ${cgs1_friendly_name}
  # One compiler worker keeps the 16 GiB development Mac responsive.
  compile_process_limit: 1
  includes:
    - device_profile.h
    - stock_miio.h
    - stock_pm_control.h
  on_loop:
    - lambda: |-
        cgs1::stock.loop();
        cgs1::pm.loop();

host:
  # Locally administered API identity, distinct from vendor Miot/BLE identities.
  mac_address: ${cgs1_api_mac}

logger:
  level: INFO

api:
  id: bridge_api
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# JSON is for the authenticated, fixed get_value response only. Keys are read
# privately from the existing device files and are never copied into this YAML.
json:

ota:
  - platform: esphome
    id: bridge_ota
    # ESPHome 2026.10 supports mandatory authenticated Noise OTA. Inherit the
    # API PSK and reject plaintext uploads, including password-only clients.
    encryption:
    port: 3232

sensor:
  - platform: uptime
    name: System uptime
    entity_category: diagnostic
    update_interval: 10s
  - platform: template
    name: CO2
    id: stock_co2
    device_class: carbon_dioxide
    state_class: measurement
    unit_of_measurement: ppm
    accuracy_decimals: 0
    force_update: true
    update_interval: 5s
    lambda: return cgs1::stock.co2();
  - platform: template
    name: Temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
    accuracy_decimals: 1
    force_update: true
    update_interval: 10s
    lambda: return cgs1::stock.temperature();
  - platform: template
    name: Humidity
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 1
    force_update: true
    update_interval: 10s
    lambda: return cgs1::stock.humidity();
  - platform: template
    name: TVOC stock estimate
    state_class: measurement
    unit_of_measurement: ppm
    accuracy_decimals: 3
    force_update: true
    update_interval: 10s
    lambda: return cgs1::stock.tvoc_ppm();
  - platform: template
    name: PM2.5
    device_class: pm25
    state_class: measurement
    unit_of_measurement: µg/m³
    accuracy_decimals: 0
    force_update: true
    update_interval: 10s
    lambda: |-
      if (cgs1::pm.available() && !cgs1::pm.enabled()) return NAN;
      return cgs1::stock.pm25();
  - platform: template
    name: Stock response age
    entity_category: diagnostic
    state_class: measurement
    unit_of_measurement: s
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return cgs1::stock.response_age();

text_sensor:
  - platform: version
    name: ESPHome version
    hide_timestamp: false
  - platform: template
    name: Firmware version
    entity_category: diagnostic
    update_interval: never
    # The matched full bundle receives this per-hardware version from the
    # committed builder. An unversioned engineering YAML must not claim v1.
    lambda: |-
      #ifdef ESPHOME_PROJECT_VERSION
      return {ESPHOME_PROJECT_VERSION};
      #else
      return {"Development build"};
      #endif


switch:
  - platform: template
    name: PM sensor
    id: pm_sensor
    icon: mdi:air-filter
    entity_category: config
    # Read the current stock property, including later touchscreen changes.
    # Never replay a saved ESPHome state over the owner's current stock setting.
    restore_mode: DISABLED
    optimistic: false
    lambda: |-
      if (!cgs1::pm.available()) return {};
      return cgs1::pm.enabled();
    turn_on_action:
      - lambda: cgs1::pm.request(true);
    turn_off_action:
      - lambda: cgs1::pm.request(false);

binary_sensor:
  - platform: template
    name: PM control available
    entity_category: diagnostic
    lambda: return cgs1::pm.available();

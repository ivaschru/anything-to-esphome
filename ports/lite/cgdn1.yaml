display:
  - platform: cgdn1_display
    id: oled
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    reset_pin: GPIO22
    # AUTO = stock probe (flash 0x3d205d == 1 -> B, else A). Force with A or B if needed.
    variant: AUTO
    # Diagnostic frame instead of the lambda (also switchable from HA, "Display test pattern"):
    # off / orientation (borders, corner markers, up arrow + TOP, L/R, variant letter) /
    # checkerboard (8 px squares) / white (all pixels).
    test_pattern: "off"
    # Upright landscape (160x128) per the stock glyph orientation; if the picture is upside
    # down on the glass use 270 (flip_x/flip_y exist for a mirrored picture).
    rotation: 90
    # No flip: the top/bottom mirror once seen on the unit (and patched with flip_x: true) came
    # from the driver raising CS after every byte, which made the controller drop the parameter
    # of `DA C0` and run C0 (COM scan opposite to stock). CS is now held low like stock, so the
    # stock C8 scan applies again. If the picture is upside down after all, put back
    # `flip_x: true` (flip_x/flip_y act on panel axes; with rotation 90 panel X is vertical).
    # Contrast at "Display brightness" 6 (100 %) and at init: stock's 0xD0. 0xFF = +23 % current.
    contrast: 0xD0
    # 8 redraws/s = the Bouncing step rate (1 px per step); slides are redrawn by the 20 ms
    # interval above. The driver only sends a frame when it differs from the last one (Bouncing:
    # every step, a variant-B frame is 10 KB = ~10 ms SPI at 8 MHz, so ~10 % of the main loop).
    # The driver logs the measured cost once a minute ("redraws, frames sent; update avg/max").
    update_interval: 125ms
    lambda: |-
      const uint32_t now = millis();
      const int W = it.get_width(), H = it.get_height();
      if (!id(local_ui).updating() && id(notify_q).active()) {
        using namespace cgdn1_notify;
        auto &nq = id(notify_q);
        nq.shown(now);
        id(led_shown) = cgdn1_led::SENSOR_NONE;
        const Message &m = nq.current();
        auto width_in = [&it](font::Font *f) -> Measure {
          return [&it, f](const std::string &s) {
            int x1, y1, w, h;
            it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
            return w;
          };
        };
        const Measure m_title = width_in(id(f_title)), m_small = width_in(id(f_small));
        auto fit = [](const std::string &s, int w, const Measure &mw) { return mw(s) <= w ? s : ellipsize(s, w, mw); };
        int top = 2, bottom = H - 4;  // body rows go in [top, bottom), the bar takes the last 2 rows
        if (!m.title.empty()) {
          it.print(W / 2, top, id(f_title), TextAlign::TOP_CENTER, fit(m.title, W - 4, m_title).c_str());
          it.horizontal_line(0, top + 21, W);
          top += 25;
        }
        const Hints hn = hints(m);
        if (!hn.empty()) {
          bottom = H - 22;
          it.horizontal_line(0, bottom, W);
          const int slot = hn.centre.empty() ? W / 2 - 4 : W / 3 - 4, y = bottom + 2;
          if (!hn.left.empty()) it.print(2, y, id(f_small), TextAlign::TOP_LEFT, fit(hn.left, slot, m_small).c_str());
          if (!hn.centre.empty())
            it.print(W / 2, y, id(f_small), TextAlign::TOP_CENTER, fit(hn.centre, slot, m_small).c_str());
          if (!hn.right.empty())
            it.print(W - 2, y, id(f_small), TextAlign::TOP_RIGHT, fit(hn.right, slot, m_small).c_str());
          bottom -= 2;
        }
        // Largest font first; the smallest takes whatever is left (cut with ".." if need be).
        const struct { font::Font *f; int pitch; } sizes[] = {
            {id(f_msg24), 25}, {id(f_msg20), 21}, {id(f_msg17), 18}, {id(f_info), 15}};
        std::vector<std::string> lines;
        font::Font *bf = nullptr;
        int pitch = 0;
        for (const auto &sz : sizes) {
          bool cut = false;
          lines = wrap(m.text, W - 4, (bottom - top) / sz.pitch, width_in(sz.f), &cut);
          bf = sz.f;
          pitch = sz.pitch;
          if (!cut) break;
        }
        int y = top + ((bottom - top) - (int) lines.size() * pitch) / 2;
        for (const auto &l : lines) {
          it.print(W / 2, y, bf, TextAlign::TOP_CENTER, l.c_str());
          y += pitch;
        }
        const int bar = (int) (W * nq.remaining(now) + 0.5f);
        if (bar > 0) it.filled_rectangle(0, H - 2, bar, 2);
        return;
      }

      cgdn1_ui::Readings values;
      const auto clock = id(ha_time).now();
      values.summary = id(display_sources).choose(now, clock.is_valid() ? clock.timestamp : 0,
                                                   id(co2).state, id(temp_comp).state);
      // Passing an invalid remote clock deliberately disables HA selection:
      // dedicated pages remain fresh physical readings, independently of idle.
      const auto local = id(display_sources).choose(now, 0, id(co2).state, id(temp_comp).state);
      values.co2 = local.co2; values.temperature = local.temperature;
      values.humidity = std::isfinite(local.temperature) ? id(rh_comp).state : NAN;
      values.pm1 = id(pm1).state; values.pm25 = id(pm25).state; values.pm10 = id(pm10).state;
      for (size_t i = 0; i < values.ha_sources.size(); ++i) values.ha_sources[i] = cgdn1_ha::sources.using_ha(i, now);
      values.co2 = cgdn1_ha::sources.value(0, now, values.co2);
      values.temperature = cgdn1_ha::sources.value(1, now, values.temperature);
      values.humidity = cgdn1_ha::sources.value(2, now, values.humidity);
      values.pm1 = cgdn1_ha::sources.value(3, now, values.pm1);
      values.pm25 = cgdn1_ha::sources.value(4, now, values.pm25);
      values.pm10 = cgdn1_ha::sources.value(5, now, values.pm10);
      values.summary.co2 = values.co2;
      values.summary.temperature = values.temperature;
      values.summary.co2_source = cgdn1_ha::sources.using_ha(0, now) ? cgdn1_display::DisplaySource::HA : cgdn1_display::DisplaySource::LOCAL;
      values.summary.temperature_source = cgdn1_ha::sources.using_ha(1, now) ? cgdn1_display::DisplaySource::HA : cgdn1_display::DisplaySource::LOCAL;
      values.summary_enabled = id(idle_screen).active_index().value_or(0) != 0;
      values.clock = clock;
      values.idle_delay = uint32_t(id(idle_screen_delay).state * 1000.0f);
      values.activity = id(night_activity_ms); values.usb = id(usb_power).state;
      values.powering_off = id(boot).powering_off();
      id(local_ui).render(it, values);
      id(led_shown) = id(local_ui).led_sensor();

# --- RGB status LED (stock 4.8.5, components/cgdn1_led/led.h) -----------------------------
# R = GPIO25, G = GPIO21, B = GPIO19, active-high, LEDC at 5 kHz like stock (stock: 10-bit; ESPHome
# picks 13-bit for 5 kHz, duties scaled exactly x8). Driven directly by the led_refresh script every
# 100 ms (no light/gamma/transitions: stock switches colours hard). It shows the level colour of the
# reading currently on screen: PM2.5/PM10 green/yellow/orange/red/deep red/purple per "PM
# standard", CO2 green/orange/red/deep red, T blue/green/yellow/orange, RH orange/yellow/green/
# blue; no data: loader (first 300 s) = LED off, E2 = orange blink 200 ms on / 300 ms off; white
# during OTA. Off while the display is off (night mode included), on the boot screen, with a display test pattern,
# during power-off, or with the "LED" switch off.
output:
  - platform: ledc
    id: led_r
    pin: GPIO25
    frequency: 5000Hz
  - platform: ledc
    id: led_g
    pin: GPIO21
    frequency: 5000Hz
  - platform: ledc
    id: led_b
    pin: GPIO19
    frequency: 5000Hz

select:
  - platform: template
    id: ui_design
    name: "Display design"
    entity_category: config
    options: ["Qingping", "Classic"]
    initial_option: "Qingping"
    optimistic: true
    restore_value: true
  - platform: template
    id: ui_motion
    name: "Screen transitions"
    entity_category: config
    options: ["Slide", "None"]
    initial_option: "Slide"
    optimistic: true
    restore_value: true
  # Keep existing moving pages as the default for upstream users. The optional
  # fixed layout has no pixel drift: lower brightness limits wear but cannot
  # eliminate OLED burn-in. Night mode and the Display switch remain in charge.
  - platform: template
    id: idle_screen
    name: "Idle screen"
    icon: mdi:monitor-dashboard
    entity_category: config
    options: ["Selected sensor", "CO2 + temperature", "Clock + date", "Clock + CO2 + temperature", "Clock", "Large CO2", "Summary"]
    initial_option: "Selected sensor"
    optimistic: true
    restore_value: true

  # Temperature model (ours, not stock): "Stock" = the original 4.8.5 brightness/charge terms
  # only, "Measured" = adds the display (brightness-dependent) and Bluetooth heat measured on
  # the device ("Display heat" / "Bluetooth heat" numbers) and moves RH to the compensated T at
  # constant vapour pressure (stock's transfer reads ~4-6 %RH high, see tcomp.h).
  # Restored; Measured first boot.
  - platform: template
    id: hc_model
    name: "Heat model"
    icon: mdi:thermometer-lines
    entity_category: config
    options: ["Stock", "Measured"]
    initial_option: "Measured"
    optimistic: true
    restore_value: true

  # PM2.5/PM10 LED thresholds (stock ucPm25Standard 0/1/2 tables; China = stock default):
  # PM2.5 <= 35/75/115/150/250 (China), 12/35/55/150/250 (US), 14/29/54/109 (EU);
  # PM10 < 50/150/250/350/420 (China), 54/154/254/354/424 (US), 24/49/89/179 (EU).
  - platform: template
    id: led_pm_standard
    name: "PM standard"
    icon: mdi:air-filter
    entity_category: config
    options: ["China", "US", "EU"]
    initial_option: "China"
    optimistic: true
    restore_value: true

  # Display diagnostics: draws a fixed frame instead of the normal pages while not "off".
  # orientation: TOP + arrow should point up and read normally, solid square top-left, hollow
  # square top-right, solid triangle bottom-left, X bottom-right, L left, R right, and the panel
  # variant letter (A/B) at the bottom; outer border = extreme pixels, inner border 2 px in.
  - platform: template
    id: display_test_pattern
    name: "Display test pattern"
    icon: mdi:test-tube
    entity_category: config
    options: ["off", "orientation", "checkerboard", "white"]
    initial_option: "off"
    optimistic: true
    set_action:
      - lambda: id(oled).set_test_pattern(x.c_str());

# --- Night mode (stock 4.8.5, components/cgdn1_night/night.h) ------------------------------
# Stock night_mode_start_time / night_mode_end_time: inside the daily window [start, end) (may
# cross midnight; start == end = never) the display, and with it the status LED, goes off once
# nothing touched the slider or the back button for 5 s; a touch or a click lights it as usual
# and it goes dark again 5 s later. Leaving the window (or switching night mode off inside it)
# turns a dark display back on, once. Stock has no on/off: start or end 0 means off, so 00:00
# could not be a start or end there; here the "Night mode" switch does that and 00:00 is a
# normal time. Restored across reboots; off by default like stock (0/0).
datetime:
  - platform: template
    id: night_start
    type: time
    name: "Night mode start"
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
  - platform: template
    id: night_end
    type: time
    name: "Night mode end"
    icon: mdi:weather-sunny
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"

text_sensor:
  # Requested PM state stays shared with the local menu; these read-only
  # diagnostics distinguish quiet operation from startup or protective fallback.
  - platform: template
    name: "PM power control"
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(pm_power).rail_state();
  - platform: template
    name: "PM guard detail"
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(pm_power).source_guard_detail();
  - platform: template
    name: "CO2 bus detail"
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(co2_bus_reader).io_detail();
  - platform: template
    name: "CO2 transaction window"
    entity_category: diagnostic
    update_interval: 5s
    lambda: return id(pm_power).window_detail();
  - platform: template
    name: "Local UI version"
    entity_category: diagnostic
    update_interval: 60s
    lambda: return {cgdn1_ui::UI_VERSION};
  - platform: template
    name: "Local UI state"
    entity_category: diagnostic
    update_interval: 1s
    lambda: return {id(local_ui).status()};
  - platform: template
    name: "Display panel"
    icon: mdi:monitor
    entity_category: diagnostic
    update_interval: 60s
    lambda: return id(oled).variant_summary();

switch:
  # One module supplies PM1.0, PM2.5 and PM10. Restored across reboots; ON on a
  # fresh install. Restoration only queues a request until the reader has probed.
  - platform: template
    id: pm_enabled
    name: "PM sensor"
    icon: mdi:air-filter
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(pm_power).set_enabled(true);
    turn_off_action:
      - lambda: id(pm_power).set_enabled(false);

  # Status LED on/off (not in stock, where only the display switch darkens it). Restored, on by
  # default; the 100 ms refresh applies it.
  - platform: template
    id: led_switch
    name: "LED"
    icon: mdi:led-on
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Night mode on/off (see "Night mode" above). Restored, off by default (stock 0/0 = off).
  - platform: template
    id: night_switch
    name: "Night mode"
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Apply the Bluetooth heat term in the Measured model (ours, not stock). Restored, on by default.
  - platform: template
    id: hc_bt_comp
    name: "Bluetooth heat compensation"
    icon: mdi:bluetooth-settings
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # BLE stack (Bluetooth proxy) on/off at runtime. DISABLED restore: on after every boot.
  - platform: template
    id: ble_switch
    name: "Bluetooth"
    icon: mdi:bluetooth
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - ble.enable:
    turn_off_action:
      - ble.disable:

  # Panel on/off (HA + the back-button click). DISABLED restore: no action at boot, the
  # driver starts lit. Off = controller display-off (AE), like stock's click.
  - platform: template
    id: display_switch
    name: "Display"
    icon: mdi:monitor
    restore_mode: DISABLED
    lambda: return id(oled).is_on();
    turn_on_action:
      - lambda: id(local_ui).request_display(true);
    turn_off_action:
      - lambda: id(local_ui).request_display(false);

# Diagnostic identity/state never includes a Wi-Fi name or password.

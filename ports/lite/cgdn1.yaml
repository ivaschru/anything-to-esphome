# ESPHome for the Qingping Air Monitor Lite (CGDN1). Install: docs/install.md.
substitutions:
  name: cgdn1
  # "true" for the first, reversible install (every reboot returns to stock), see docs/install.md:
  #   esphome -s trial_mode true compile cgdn1.yaml
  trial_mode: "false"
  # "true" for on-screen notifications and questions over MQTT (README; needs the mqtt_*
  # secrets, packages/mqtt_true.yaml):
  #   esphome -s mqtt_messages true compile cgdn1.yaml
  mqtt_messages: "false"
  ha_display: "false"
  ha_display_entity: sensor.cgdn1_display_feed

packages:
  mqtt_messages: !include packages/mqtt_${mqtt_messages}.yaml
  ha_display: !include packages/ha_display_${ha_display}.yaml
  ha_sources: !include packages/ha_sources.yaml

esphome:
  on_boot:
    # Wire the gate before any loop-driven asynchronous sensor reading.
    - priority: -100
      then:
        - lambda: id(co2_bus_reader).set_transaction_gate(id(pm_power));
    - priority: 300
      then:
        - lambda: |-
            if (id(ble_switch).state) id(ble).enable();
            else id(ble).disable();
  name: ${name}
  # Keep the self-heating compensation's restore record current on a clean reboot/OTA
  # (stock saves right before its reboots too). Shutdown runs in reverse setup-priority
  # order: this trigger (600) -> globals (800, queues the NVS write) -> preferences (1000, sync).
  on_shutdown:
    - lambda: |-
        if (id(tc_engine).ready()) {
          id(tc_saved) = id(tc_engine).snapshot();
          id(tc_heat_saved) = id(tc_engine).heat_snapshot();
        }

esp32:
  board: esp32dev
  flash_size: 4MB
  # Partition table: the stock one, supplied by cgdn1_boot (do not set `partitions:`).
  framework:
    type: esp-idf
    # IDF default is ERROR: raise to INFO so the wifi/phy driver lines reach the log
    # (and the optional flash log, which is only 64 KB: not DEBUG/VERBOSE).
    log_level: INFO
    advanced:
      # The stock bootloader (IDF 4.0.3) is kept and has no app rollback support.
      enable_ota_rollback: false
      # CGDN1 units ship with a factory-MAC eFuse that fails its CRC (Qingping's IDF fork skips the
      # check). Without this the IDF WiFi driver runs as 00:00:00:00:00:00 and every auth ends
      # "Auth Expired"; stock uses the raw MAC.
      ignore_efuse_mac_crc: true
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHMODE_DIO: "y"
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "y"
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: "y"
      CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE: "n"
      # NVS at 0x9000 still holds the stock firmware's WiFi/MQTT config (stock stays in the
      # other OTA slot): keep IDF's WiFi/PHY components from writing their own namespaces into it.
      CONFIG_ESP_WIFI_NVS_ENABLED: "n"
      CONFIG_ESP_PHY_CALIBRATION_AND_DATA_STORAGE: "n"

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: components
    components: [cgdn1_boot, cgdn1_tcomp, cgdn1_display, cgdn1_touch, cgdn1_led, cgdn1_night, cgdn1_notify, cgdn1_pm, cgdn1_ui, cgdn1_ha_sources, scd4x]

# Power latch (GPIO23/13/18 HIGH from a global constructor, before anything else runs) and the
# back-button long-press power-off. Must always be present: without it the unit switches itself off.
cgdn1_boot:
  id: boot
  # Trial install: every boot marks the other OTA slot (the stock firmware this was installed
  # from) as the next boot, so any reboot returns to stock. See docs/install.md. While this is
  # on, do NOT use ESPHome's own OTA (dashboard / `esphome run` / HA update / captive portal
  # upload): it writes the other slot and overwrites stock.
  trial_mode: ${trial_mode}

# Stock temperature/humidity self-heating compensation (components/cgdn1_tcomp/tcomp.h,
# exact port of stock 4.8.5 "Sensor_Temp_Humi_Temp_Fix_Task"); wired up below: sht4x ->
# 1 s interval -> "Temperature"/"Humidity" templates, restore record in NVS (globals).
cgdn1_tcomp:

# Stock RGB status LED logic (components/cgdn1_led/led.h: level thresholds, duties, blink);
# wired up under "RGB status LED" below.
cgdn1_led:

# Stock night mode (components/cgdn1_night/night.h: window test, 1 s tick); wired up under
# "Night mode" below.
cgdn1_night:

# Notifications and questions on the screen (components/cgdn1_notify/notify.h, ours); fed over
# MQTT by packages/mqtt_true.yaml (substitution mqtt_messages), shown by the display lambda.
cgdn1_notify:

cgdn1_ui:
  id: local_ui
  display_id: oled
  brightness_id: display_level
  pm_switch_id: pm_enabled
  ble_switch_id: ble_switch
  night_switch_id: night_switch
  pm_power_id: pm_power
  battery_id: battery_level
  pm25_id: pm25
  font_status: ui_status
  font_small: ui_small
  font_title: ui_title
  font_medium: ui_medium
  font_large: ui_large
  font_number: ui_number
  font_summary: ui_summary
  restart_button: ui_restart
  slot_button: ui_other_slot
  numbers:
    "0": display_level
    "3": idle_screen_delay
    "13": tc_temp_offset
    "14": tc_rh_offset
    "17": hc_a6
    "18": hc_a1
    "19": hc_tau_d1
    "20": hc_tau_d2
    "21": hc_a_bt
    "22": hc_tau_bt
  switches:
    "1": display_switch
    "6": night_switch
    "9": pm_enabled
    "10": led_switch
    "12": ble_switch
    "16": hc_bt_comp
    "24": ha_values_enabled
  selects:
    "2": idle_screen
    "4": ui_design
    "5": ui_motion
    "11": led_pm_standard
    "15": hc_model
    "23": display_test_pattern
  times:
    "7": night_start
    "8": night_end


wifi:
  reboot_timeout: 0s
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} Fallback"
    password: !secret ap_password

captive_portal:

mdns:

ota:
  - platform: esphome
    password: !secret ota_password
    # Status LED white for the whole OTA, like stock's OTA screen (the transfer blocks the main
    # loop, so the refresh is run right here instead of waiting for the 100 ms interval). On
    # success it stays white until the reboot.
    on_begin:
      - lambda: |-
          id(led_ota) = true;
          id(local_ui).ota_begin();
      - script.execute: led_refresh
    on_progress:
      - lambda: id(local_ui).ota_progress(x);
    on_end:
      - lambda: id(local_ui).ota_end();
    on_error:
      - lambda: |-
          id(led_ota) = false;
          id(local_ui).ota_error();
      - script.execute: led_refresh
    on_abort:
      - lambda: |-
          id(led_ota) = false;
          id(local_ui).ota_error();
      - script.execute: led_refresh

api:
  # Authenticated diagnostic actions use exactly the physical UI handler.
  # They never accept or return Wi-Fi passwords; frame capture is refused in
  # a credential editor/trial. These actions allow real framebuffer review.
  actions:
    - action: pm_gpio_inventory
      then:
        - lambda: |
            if (!id(local_ui).updating()) id(local_ui).request_pin_inventory();
    # Fixed hardware readback for the PM fan investigation. No output or mux
    # writes; known input buffers are enabled briefly and restored for actual
    # pad readback. No pin/value/register/address can be supplied by the client.
    - action: pm_diagnose
      then:
        - lambda: |-
            if (!id(local_ui).updating()) cgdn1_ui::diagnose_pm(id(pm_power), id(pm_reader));
    - action: ui_gesture
      variables:
        gesture: string
      then:
        - lambda: |-
            if (id(local_ui).consume_dark_gesture(gesture)) return;
            id(night_activity_ms) = millis();
            id(local_ui).mark_touched();
            id(local_ui).gesture(gesture);
    - action: ui_show_page
      variables:
        page: int
        detail: int
      then:
        - lambda: |-
            id(night_activity_ms) = millis();
            id(local_ui).show_page(page, detail);
    - action: ui_capture
      then:
        - lambda: id(local_ui).capture();
    - action: ui_select_network
      variables:
        ssid: string
      then:
        - lambda: |-
            id(night_activity_ms) = millis();
            id(local_ui).select_network(ssid);
  # Standalone measurements/UI must survive an absent HA server.
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

# Local wall clock for night mode, from Home Assistant over the API (its time zone too; stock
# uses SNTP + its own time zone setting). Until the first sync the clock is invalid and night
# mode does nothing, like stock before its clock is set.
time:
  - platform: homeassistant
    id: ha_time

# Bluetooth proxy for Home Assistant (not in stock; stock's BLE is HomeKit/MiIO pairing only).
# BLE shares the radio with WiFi (software coexistence) and keeps the CPU busier, so it adds
# self-heat: the "Bluetooth" switch below stops/starts the BLE stack at runtime (also used by the
# self-heating tests). Always on after a boot. Costs ~440 KB of the app slot.
esp32_ble:
  id: ble
  enable_on_boot: false

esp32_ble_tracker:

# Passive: advertisements only, no GATT connections through this device. With active
# connections the ESP32 BT controller blob asserted (r_assert in r_lld_con_start <-
# hci_le_create_con_cmd_handler) after ~2 h of Home Assistant retrying a device that kept
# failing to connect (every ~20 s). Connection-based devices need another HA Bluetooth adapter.
bluetooth_proxy:
  active: false

button:
  - platform: restart
    id: ui_restart
    name: "Restart"
  # Boots the firmware in the other OTA slot: stock right after the install, the previous
  # ESPHome image after an ESPHome OTA update. Refused (logged, no reboot) if that slot does
  # not hold a valid image.
  - platform: template
    id: ui_other_slot
    name: "Boot other firmware slot"
    entity_category: config
    on_press:
      - lambda: id(boot).boot_other_slot();

# Qualified direct-I2C profile: PM OFF keeps GPIO13 LOW between bounded
# SCD4x transactions. Fresh-source and transaction guards fall back to HIGH.
# GPIO18 and whole-board shutdown ownership remain unchanged. After the reader's
# boot probe, apply the restored polling preference and invalidate OFF values.
# Each ON waits 30 s before measurements; an intervening OFF cancels that wait.
cgdn1_pm:
  co2_source: co2
  temperature_source: t_raw
  humidity_source: rh_raw
  id: pm_power
  reader_id: pm_reader
  enable_pin: GPIO13
  pm_1_0: pm1
  pm_2_5: pm25
  pm_10_0: pm10
  warmup_time: 30s

# --- Air sensors (I2C bus 0) -------------------------------------------------
# Pins/addresses from the stock 4.8.5 firmware (docs/hardware.md): bus 0 is
# SDA=26/SCL=27 at 20 kHz in stock. The sensor rails (GPIO13/18) are already HIGH from
# cgdn1_boot's constructor, so the parts are powered long before setup.
# 0x10 on this bus is the Apple MFi authentication coprocessor that stock's HomeKit stack
# talks to (esp-homekit-sdk esp_mfi_coprocessor.c, tag "mfi_i2c", FUN_400fd26c..400fd444:
# regs 0x00 info, 0x10 auth control/status, 0x11 response, 0x20/0x21 challenge), not a sensor.
# Bus 1 (SDA=12/SCL=14) is the ATtiny814 touch slider, see "Touch slider" below. The OLED
# (SPI 5/4/15/2/22) is further down.
i2c:
  - id: bus_a
    sda: GPIO26
    scl: GPIO27
    # Same as stock. Accepted by the IDF 5.5.5 i2c_master driver on ESP32; only the 10-bit
    # start/stop setup fields truncate (2000 -> 976 APB cycles, ~12 us; spec minimum 4.7 us).
    frequency: 20kHz
    # Logs "Found device at address 0x.." in the config dump.
    scan: true
  # Bus 1: the ATtiny814 touch-slider controller @0x0C, exactly the stock config (platform_i2c_init
  # FUN_400edc98, table 0x3ffbddf0 entry 1: HW port 1, SDA=12, SCL=14, 400 kHz; its i2c_config_t
  # sets sda_pullup_en = scl_pullup_en = GPIO_PULLUP_ENABLE, i.e. the internal pull-ups ON, which
  # is also ESPHome's default, so nothing extra is enabled here).
  # GPIO12 = MTDI, the flash-voltage strapping pin, sampled at reset before any firmware runs: the
  # board's own resistors set the strap (stock drives this bus, pull-ups and all, on the same
  # hardware and boots/reboots fine). The I2C driver only uses it open-drain (it can pull low,
  # never drive high; ESPHome's bus recovery at setup is open-drain too) and enables no pull-up
  # that stock does not, so this changes nothing for the strap compared with stock.
  - id: bus_b
    sda:
      number: GPIO12
      ignore_strapping_warning: true  # see above
    scl: GPIO14
    frequency: 400kHz
    # Stock i2c_set_timeout(1, 400000) (FUN_400edc98 -> 0x400f362c, table 0x3ffbddf0 entry 1
    # +24): 400000 APB cycles = 5 ms of SCL low (clock stretching) before a timeout; the IDF
    # default would be 2 ms. 5000 us x 80 cycles/us = the same register value.
    timeout: 5ms
    # No scan: it address-probes every device in WRITE mode, which stock never does to the ATtiny
    # (read-only, see "Touch slider"). cgdn1_touch logs its probe read / idle checks instead.
    scan: false

sensor:
  # SCD40 CO2 @0x62 (stock cmds 0x21b1/0x3f86 = start/stop periodic measurement).
  - platform: scd4x
    id: co2_bus_reader
    i2c_id: bus_a
    address: 0x62
    update_interval: 15s
    co2:
      id: co2
      name: "CO2"
      # HA otherwise deduplicates identical native-API values before writing
      # last_reported. A real sample must refresh physical-source freshness,
      # even when its number is unchanged; screen telemetry must not do that.
      force_update: true
      on_value:
        - lambda: id(display_sources).local_co2_seen(millis());
    # The SCD40's own T/RH (self-heated, offset-compensated): diagnostic cross-check only.
    temperature:
      name: "CO2 sensor temperature"
      entity_category: diagnostic
    humidity:
      name: "CO2 sensor humidity"
      entity_category: diagnostic

  # Plantower PMSA003I @0x12, I2C variant (stock reads the 32-byte "BM" 0x001C frame).
  # standard_units (default) = atmospheric values, which is what stock consumes.
  - platform: pmsa003i
    id: pm_reader
    i2c_id: bus_a
    address: 0x12
    update_interval: 60s
    pm_1_0:
      id: pm1
      name: "PM1.0"
    pm_2_5:
      id: pm25
      name: "PM2.5"
    pm_10_0:
      id: pm10
      name: "PM10"

  # T/RH @0x44 is a Sensirion SHT4x: the stock driver (FUN_400f0cac/0cd4/0e0c) sends the
  # single-byte SHT4x commands 0x94 (soft reset), 0xFD (measure, high precision; then a
  # 10 ms wait) and 0x89 (read serial), and converts RH = -6 + 125*raw/65535, a formula
  # only SHT4x uses (SHT3x/HDC302x use 100*raw/65535 and 2-byte commands).
  # These are the RAW readings (the board heats the sensor by ~6 C once warm): kept as
  # diagnostics for comparison. The model in the 1 s interval below reads them with
  # get_raw_state() (every 10 s reading); the throttle only limits what HA gets.
  - platform: sht4x
    i2c_id: bus_a
    address: 0x44
    update_interval: 10s  # heater stays off (default)
    temperature:
      id: t_raw
      on_value:
        - lambda: id(display_sources).local_temperature_seen(millis());
      name: "Temperature (raw)"
      entity_category: diagnostic
      filters:
        - throttle: 60s
    humidity:
      id: rh_raw
      name: "Humidity (raw)"
      entity_category: diagnostic
      filters:
        - throttle: 60s

  # Compensated values, published by the 1 s interval every 10 s. Same names as the former
  # sht4x entities so the HA entities (and their history) carry on.
  - platform: template
    id: temp_comp
    name: "Temperature"
    force_update: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: rh_comp
    name: "Humidity"
    force_update: true
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never

  # Battery (stock Battery_Task FUN_400f1c90; init FUN_400f19c4):
  # - GPIO39 / ADC1 ch3 is the battery, 11 dB (= IDF5 "12db") + esp_adc_cal. FUN_400f1b94
  #   averages 5 samples and returns (pin_mV & 0x7fff) << 1: a 1:2 divider, so multiply 2.0.
  - platform: adc
    id: battery_voltage
    pin: GPIO39
    name: "Battery voltage"
    attenuation: 12db
    samples: 8
    update_interval: 60s
    device_class: voltage
    unit_of_measurement: V
    accuracy_decimals: 2
    filters:
      - multiply: 2.0
  # Stock voltage->percent table (DROM 0x3f409826, used by FUN_400f1acc/FUN_400f1b34): 101
  # descending mV points for 100%..0%; a reading between points k+1 and k reports the upper
  # point's percent, > 4199 mV is 100 and <= 2900 mV is 0. (Stock also only lets the value
  # fall on battery and rise on USB; that ratchet is not reproduced here.)
  - platform: copy
    source_id: battery_voltage
    id: battery_level
    name: "Battery level"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - lambda: |-
          static const uint16_t MV[101] = {
            4200, 4150, 4140, 4102, 4080, 4062, 4050, 4042, 4034, 4028, 4023, 4018, 4014, 4009,
            4004, 3998, 3991, 3982, 3973, 3963, 3951, 3940, 3929, 3916, 3914, 3907, 3892, 3882,
            3872, 3861, 3852, 3844, 3834, 3826, 3817, 3808, 3799, 3790, 3780, 3771, 3761, 3751,
            3741, 3731, 3721, 3710, 3700, 3689, 3679, 3669, 3659, 3649, 3639, 3630, 3622, 3613,
            3605, 3598, 3590, 3583, 3577, 3570, 3565, 3566, 3556, 3550, 3544, 3537, 3531, 3526,
            3519, 3513, 3508, 3502, 3495, 3489, 3482, 3475, 3468, 3460, 3452, 3444, 3434, 3425,
            3415, 3403, 3392, 3380, 3366, 3353, 3342, 3330, 3319, 3308, 3295, 3281, 3266, 3243,
            3213, 3100, 2900};
          if (std::isnan(x)) return x;
          const int mv = (int) lroundf(x * 1000.0f);
          if (mv > 4199) return 100.0f;
          if (mv <= 2900) return 0.0f;
          int pct = 0;
          for (int k = 0; k < 100; k++)  // same scan as stock: the last (lowest) match wins
            if (MV[k] >= mv && MV[k + 1] <= mv) pct = 100 - k;
          return (float) pct;
  # GPIO35 / ADC1 ch7 is the charger's current-program (PROG/ISET) pin, not a battery tap.
  # Stock samples it at 2.5 dB (adc1_config_channel_atten(7,1); 0..~1.25 V) and, on USB,
  # converts it as (mV/1000)/2000*1000*1000 = pin_mV/2 mA, i.e. I = 1000 * V_PROG / 2 kOhm
  # (LTC4054/TP4054-style monitor). Stock also reads it as a GPIO: low while Vbat <= 4.05 V
  # means "charging", high or Vbat > 4.05 V means "charging done". At 12 dB the ADC floor
  # (~0.14 V) would read as a bogus ~70 mA, hence 2.5 dB like stock.
  # Even at 2.5 dB the calibrated ADC bottoms out at ~78 mV: on the unit this read a constant
  # 39 mA with USB UNPLUGGED (Vbat 4.17 V, no charger current possible), i.e. the ADC floor,
  # not current. So the floor is subtracted and the result clamped at 0 (a true ~0 reads 0;
  # cgdn1_tcomp's "charger active" test, > 20 mA, now sees real current instead of the floor).
  - platform: adc
    id: charge_current
    pin: GPIO35
    name: "Charge current"
    attenuation: 2.5db
    samples: 8
    update_interval: 60s
    device_class: current
    unit_of_measurement: mA
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - multiply: 500.0  # V -> mA (pin_mV / 2)
      - lambda: |-
          static constexpr float ADC_FLOOR_MA = 39.0f;  // ~78 mV floor at 2.5 dB (see above)
          return std::isnan(x) ? x : std::max(0.0f, x - ADC_FLOOR_MA);

  # Heat-model diagnostics (ours, not stock): the display and Bluetooth heat the Measured model
  # currently subtracts, published by the 1 s interval every 10 s (NaN until the engine is ok).
  - platform: template
    id: hc_display_heat
    name: "Display heat estimate"
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: hc_bt_heat
    name: "Bluetooth heat estimate"
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: never

  - platform: wifi_signal
    id: wifi_rssi
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    id: uptime_s
    name: "Uptime"
    update_interval: 60s

binary_sensor:
  - platform: template
    id: ble_scanner_active
    name: "BLE scanner active"
    entity_category: diagnostic
    lambda: return id(ble).is_active();
  # Charge / USB-present: stock reads gpio_get_level(34)==0 (active-low). GPIO34 is
  # input-only and has no internal pulls.
  - platform: gpio
    id: usb_power
    pin:
      number: GPIO34
      mode: INPUT
      inverted: true
    name: "Charging"
    device_class: battery_charging

  # Back power button: stock reads GPIO36 active-low (pressed = 0) with an EXTERNAL pull-up
  # (GPIO34-39 have no internal pulls: mode INPUT, no pullup). Holding it powers the board in
  # hardware. Polled, not interrupt-driven: ESP32 erratum 3.11 glitches GPIO36 low while the
  # SAR ADC (battery sensors above) samples. The initial state at boot fires no trigger.
  - platform: gpio
    id: power_button
    name: "Power button"
    pin:
      number: GPIO36
      mode: INPUT
      inverted: true
    use_interrupt: false
    filters:
      - delayed_on_off: 30ms  # debounce (stock: 50 ms ISR debounce, click >= 30 ms)
    on_click:
      min_length: 30ms
      max_length: 1s
      then:
        - lambda: id(night_activity_ms) = millis();  # stock: a click clears the idle counters
        # Stock toggles the display on a click (and so do we); HA also gets the event.
        - switch.toggle: display_switch
        - event.trigger:
            id: power_button_event
            event_type: click
    on_press:
      - lambda: id(night_activity_ms) = millis();  # stock: a push clears the idle counters
      - script.execute: power_button_hold
    on_release:
      - script.stop: power_button_hold

script:
  # Long press = held 2 s, fired while still held (stock). The power-off itself (and its
  # guards: armed only after a post-boot release, refused on USB power) is in cgdn1_boot.
  - id: power_button_hold
    mode: restart
    then:
      - delay: 2s
      - if:
          condition:
            binary_sensor.is_on: power_button
          then:
            - event.trigger:
                id: power_button_event
                event_type: long_press
            - lambda: id(boot).power_off_long_press();

  # MQTT screen messages: light the panel for a newly shown message (unless "wake": false),
  # publish the outcomes, redraw right away on a change (not at the next 125 ms update). Run
  # after every change (message in, clear, gesture) and by the 100 ms interval (timeouts).
  - id: notify_sync
    then:
      - lambda: |-
          auto &nq = id(notify_q);
          static size_t last_size = 0;
          const bool fresh = nq.take_new_current();
          bool changed = fresh || nq.size() != last_size;
          last_size = nq.size();
          if (fresh && nq.current().wake && !id(oled).is_on()) id(display_switch).turn_on();
          for (const auto &o : nq.take_outcomes()) {
            changed = true;
            const std::string j = o.json();
          #ifdef USE_MQTT  // mqtt_messages "true"
            auto *mq = mqtt::global_mqtt_client;
            if (!mq->publish(mq->get_topic_prefix() + "/notify/response", j))
              ESP_LOGW("notify", "response not sent (MQTT down): %s", j.c_str());
            else
              ESP_LOGI("notify", "response %s", j.c_str());
          #else
            ESP_LOGI("notify", "response %s", j.c_str());
          #endif
          }
          if (changed && id(oled).is_on()) id(oled).update();

  # RGB status LED (stock RGB_LED_Task): pick the state, step the blink, write the duties. Run
  # every 100 ms by the interval below and right away by the OTA triggers.
  - id: led_refresh
    then:
      - lambda: |-
          using namespace cgdn1_led;
          Inputs in;
          in.enabled = id(led_switch).state;
          in.powering_off = id(boot).powering_off();
          in.display_on = id(oled).is_on();
          in.test_pattern = id(oled).get_test_pattern() != cgdn1_display::TEST_PATTERN_OFF;
          in.ota = id(led_ota);
          in.sensor = id(led_shown);
          switch (in.sensor) {
            case SENSOR_PM1: in.value = id(pm1).state; break;
            case SENSOR_PM25: in.value = id(pm25).state; break;
            case SENSOR_PM10: in.value = id(pm10).state; break;
            case SENSOR_CO2: in.value = id(co2).state; break;
            case SENSOR_TEMP: in.value = id(temp_comp).state; break;  // compensated, as displayed
            case SENSOR_HUMI: in.value = id(rh_comp).state; break;
            default: break;
          }
          // Stock: a sensor still warming up (no reading yet, status 1) -> LED off; E2 later ->
          // blink. Same window as the page (make_page): loader = LED off, E2 = orange blink.
          in.value = id(local_ui).led_value();  // same physical source, fresh or unavailable
          in.warming_up = millis() < cgdn1_display::LOADING_MAX_MS;
          in.standard = static_cast<PmStandard>(id(led_pm_standard).active_index().value_or(0));
          auto &led = id(led_engine);
          const Colour before = led.colour();
          const Rgb d = led.tick(in);
          if (led.colour() != before)
            ESP_LOGD("led", "%s (shown sensor %d)", colour_name(led.colour()), (int) in.sensor);
          // Stock 10-bit duty / 1024. The ledc outputs run 13-bit at 5 kHz: round(d/1024 * 8191)
          // = 8 * d exactly for every stock duty (1024 = steady on), so the duty cycles match.
          id(led_r).set_level(d.r / 1024.0f);
          id(led_g).set_level(d.g / 1024.0f);
          id(led_b).set_level(d.b / 1024.0f);

event:
  - platform: template
    id: power_button_event
    name: "Power button press"
    event_types:
      - click
      - long_press
  - platform: template
    id: touch_event
    name: "Touch"
    icon: mdi:gesture-swipe-horizontal
    event_types:
      - swipe_left
      - swipe_right
      - tap_left
      - tap_centre
      - tap_right
      - long_touch

# --- Touch slider (top edge; components/cgdn1_touch) ---------------------------------------
# ATtiny814 @0x0C on bus_b, data-ready GPIO32 (input + pull-up, low = ready; stock FUN_400e2678 /
# FUN_400e26a0). Gestures and thresholds are stock 4.8.5 (components/cgdn1_touch/gesture.h), the
# read schedule too (schedule.h), run like stock's Touch_Task in its own 10 ms FreeRTOS task woken
# by a GPIO32 interrupt, independent of the main loop. Like stock, a failing read never disables
# the slider, and the idle chip is never read. Device-test lines: "Idle check: GPIO32=.., reads
# .., touches .., truncated .., max first-sample latency .." (INFO, every 30 s without reads),
# "raw .." (DEBUG, per touch), the gesture with "first +N ms" (INFO).
# Actions follow stock (oled_task_sensor_page_callback FUN_400e36a0 and friends):
#  - swipe_left (finger toward the left end) / tap_left  -> NEXT reading / page
#    (stock: "left click" -> status 8 -> FUN_400e3e28 -> get_next_sensor; a drag toward the left
#    end scrolls the pages forward)
#  - swipe_right / tap_right -> PREVIOUS (stock: "right click" -> FUN_400e3c18 -> get_last_sensor)
#  - tap_centre -> HA event only, like stock (no centre action). The display is turned off
#    with the back button; a touch-driven toggle was too easy to trigger by accident.
#  - display off: any touch turns it on and does nothing else (stock: a touch on the dark panel
#    sets the display status back to on, FUN_400e36a0 bits 0x9c -> FUN_400e98e8(0))
#  - long_touch (7.2 s still): HA event only (stock: network reset, not reproduced).
#  - an MQTT message on screen (packages/mqtt_true.yaml): the gesture goes to it (answer / dismiss) and does
#    not change the page.
# Every gesture is also an HA event ("Touch"), the wake-up one included.
cgdn1_touch:
  id: touch
  i2c_id: bus_b
  data_ready_pin:
    number: GPIO32
    mode: INPUT_PULLUP
    inverted: true
  on_touch:
    - lambda: |-
        id(night_activity_ms) = millis();  // real touch resets inactivity
        id(local_ui).mark_touched();
        id(touch_wake) = !id(oled).is_on();
  on_release:
    - lambda: id(night_activity_ms) = millis();  # idle counts from the last touched sample
  on_gesture:
    - event.trigger:
        id: touch_event
        event_type: !lambda return gesture;
    - lambda: |-
        if (id(local_ui).consume_dark_gesture(gesture)) return;
        if (id(notify_q).active()) {  // a message is up: the gesture is for it, not the pages
          id(notify_q).gesture(gesture);
          id(notify_sync).execute();
          return;
        }
        id(local_ui).gesture(gesture);

# --- Self-heating compensation (stock 4.8.5, see components/cgdn1_tcomp/tcomp.h) -------
# Stock subtracts the board's self-heat from the SHT4x reading with a per-second model:
# T = T_raw + preheat(on) + discharging(dis) + bright(b) + (300-bst)/300 * charge_term,
# slew-limited to 0.3 C/s for jumps > 3 C, then RH is moved to that T (Magnus ratio) and
# x0.9 above 55 %RH raw. Steady state on USB, battery full, no display: T_raw - 5.98 C,
# reached over ~2 h of uptime (-3.7 C at 20 min, -5.6 C at 1 h).
globals:
  - id: display_sources
    type: cgdn1_display::DisplaySources
  - id: tc_engine
    type: tcomp::Engine
  # Restore record (stock config_store 0x16/0x17/0x18/0x1a equivalents). Stock keeps it in
  # its raw-flash store at 0x3d0000, which we never write: this lives in NVS (namespace
  # "esphome"). Refreshed every 5 min + on clean shutdown; one 10-byte blob, written only
  # when changed and coalesced by the preferences flush (60 s) -> <= 1 NVS write / 5 min.
  - id: tc_saved
    type: tcomp::Saved
    restore_value: true
  # Restore record of the Measured heat model (components/cgdn1_tcomp/heat.h, ours, not stock):
  # the two display cascades (p, q) and the Bluetooth lag, so the warm-up survives a reboot/OTA.
  # NVS like tc_saved, refreshed every 5 min + on clean shutdown.
  - id: tc_heat_saved
    type: tcomp::heat::Saved
    restore_value: true
  # Display hook: mirrors id(oled).is_on(), refreshed by the 1 s interval below (stock feeds
  # brightness target 100 while the panel is on, 0 when off; the -1 C term ramps 20 s/%).
  # Feeds the Stock model only (on/off, stock never varies the OLED contrast); the Measured
  # model takes "Display brightness" (level) itself, see the "Display heat" numbers.
  - id: tc_display_on
    type: bool
    initial_value: "true"
  # Stock page slider (cgdn1_display::PageSlider: slides FUN_400e3e28 / FUN_400e3c18): 7 pages
  # (stock 5 + our PM1.0 and info), a 10 px / 20 ms push slide on a touch only (no carousel; the
  # info page alone slides on after 10 s); the touch slider chains
  # next()/prev() (ignored before the first page is drawn). Stepped by update() in the lambda.
  - id: pages
    type: cgdn1_display::PageSlider
  # Set at touch-down when that touch turned the dark panel on: its gesture does nothing else.
  - id: touch_wake
    type: bool
    initial_value: "false"
  # RGB status LED (components/cgdn1_led): the 100 ms state machine, the reading currently on
  # screen (set by the display lambda every redraw; SENSOR_NONE = boot screen / info page) and the
  # OTA flag.
  - id: led_engine
    type: cgdn1_led::Engine
  - id: led_shown
    type: cgdn1_led::Sensor
    initial_value: cgdn1_led::SENSOR_NONE
  - id: led_ota
    type: bool
    initial_value: "false"
  # Night mode (components/cgdn1_night): the 1 s state machine and millis() of the last touch /
  # back-button push or click (stock idle counters sys+0xa0/+0xa4).
  - id: night_engine
    type: cgdn1_night::Engine
  # MQTT screen messages (components/cgdn1_notify): the shown one + the waiting ones.
  - id: notify_q
    type: cgdn1_notify::Queue
  - id: night_activity_ms
    type: uint32_t
    initial_value: "0"

number:
  # Idle page delay. Touch/back-button activity returns to the normal sensor
  # pages; after this delay the selected idle layout returns, without movement.
  - platform: template
    id: idle_screen_delay
    name: "Idle screen delay"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "s"
    min_value: 1
    max_value: 300
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
  # Stock user calibration (cloud "temperature_offset"/"humidity_offset", config_store
  # 0x43/0x45; the *_zoom variants are not exposed). Applied after the model, before the
  # final clamps (T >= 0, RH 0..99.9).
  - platform: template
    id: tc_temp_offset
    name: "Temperature offset"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: -10
    max_value: 10
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: tc_rh_offset
    name: "Humidity offset"
    entity_category: config
    unit_of_measurement: "%"
    min_value: -20
    max_value: 20
    step: 0.1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
  # Measured heat model (ours, not stock; selected by "Heat model"): the display and Bluetooth
  # self-heating subtracted from T. Defaults = an on/off test fit of one unit (Bluetooth-on display
  # edges, see heat.h) and equal heat::Params in components/cgdn1_tcomp/heat.h; NaN falls back
  # to them there. Saved values win over these on an already-flashed device.
  # Display heat at brightness 6: steady-state rise of the sensor.
  - platform: template
    id: hc_a6
    name: "Display heat"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 5
    step: 0.05
    initial_value: 1.5
    optimistic: true
    restore_value: true
    mode: box
  # Display heat at brightness 1 (levels in between are interpolated by panel current).
  - platform: template
    id: hc_a1
    name: "Display heat at brightness 1"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 5
    step: 0.05
    initial_value: 1.25
    optimistic: true
    restore_value: true
    mode: box
  # First display lag (fast part of the warm-up).
  - platform: template
    id: hc_tau_d1
    name: "Display heat lag"
    entity_category: config
    unit_of_measurement: "s"
    min_value: 10
    max_value: 600
    step: 5
    initial_value: 110
    optimistic: true
    restore_value: true
    mode: box
  # Second display lag (slow soak of the case).
  - platform: template
    id: hc_tau_d2
    name: "Display heat time"
    entity_category: config
    unit_of_measurement: "s"
    min_value: 60
    max_value: 3600
    step: 10
    initial_value: 1130
    optimistic: true
    restore_value: true
    mode: box
  # Steady-state rise while the Bluetooth stack is active.
  - platform: template
    id: hc_a_bt
    name: "Bluetooth heat"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 3
    step: 0.05
    initial_value: 1.6
    optimistic: true
    restore_value: true
    mode: box
  # Bluetooth lag.
  - platform: template
    id: hc_tau_bt
    name: "Bluetooth heat time"
    entity_category: config
    unit_of_measurement: "s"
    min_value: 60
    max_value: 3600
    step: 10
    initial_value: 1070
    optimistic: true
    restore_value: true
    mode: box
  # OLED brightness as 6 discrete levels (every position visibly changes the screen), mapped to
  # Cgdn1Display::set_brightness(%) as (level - 1) * 20 %; 6 = default/max, 1 still faintly lit
  # (dark is the "Display" switch):
  #  both panel variants: controller contrast 0x81 <byte>, level 6 = `contrast:` (stock 0xD0),
  #  each level below 0.75 stop (x0.59 current) dimmer: 0xD0 7C 4A 2C 1A 0F. Lit pixels stay
  #  gray 0xF like stock. (0x81 once looked dead on this panel: the driver raised CS after every
  #  byte and the controller dropped the parameter; CS is now held low like stock.)
  # Restored at boot: the number publishes its saved value before the display init, which then
  # starts with it. (New id: the former 0..100 % number's saved value must not be reused.)
  - platform: template
    id: display_level
    name: "Display brightness"
    icon: mdi:brightness-6
    entity_category: config
    min_value: 1
    max_value: 6
    step: 1
    initial_value: 6
    optimistic: true
    restore_value: true
    mode: slider
    on_value:
      - lambda: id(oled).set_brightness((x - 1.0f) * 20.0f);

interval:
  - interval: 100ms  # status LED: stock RGB_LED_Task period (blink = 2 on / 3 off ticks)
    then:
      - script.execute: led_refresh
  - interval: 100ms  # MQTT screen messages: timeouts
    then:
      - lambda: id(notify_q).tick(millis());
      - script.execute: notify_sync
  # Slide cadence: stock redraws every 20 ms while a slide runs (10 px per frame). The slider is
  # time-based, so a late frame only skips a position; the driver sends only changed frames (idle
  # pages cost nothing here, the 125 ms display update_interval covers the bounce).
  - interval: 20ms
    then:
      - lambda: 'if (id(pages).animating()) id(oled).update();'
  - interval: 1s
    then:
      - lambda: |-
          // Night remains black when idle. Any recognized touch temporarily wakes
          // the UI for 30 s; this does not change the saved Display preference.
          const auto clock = id(ha_time).now();
          id(local_ui).set_night_active(id(night_switch).state && clock.is_valid() &&
              cgdn1_night::in_window(clock.hour, clock.minute,
                id(night_start).hour*60+id(night_start).minute,
                id(night_end).hour*60+id(night_end).minute));

  - interval: 1s  # the stock model steps once per second: do not change
    then:
      - lambda: |-
          auto &tc = id(tc_engine);
          const bool was_ready = tc.ready();
          tcomp::Inputs in;
          in.t_raw = id(t_raw).get_raw_state();
          in.rh_raw = id(rh_raw).get_raw_state();
          in.usb = id(usb_power).state;  // GPIO34 low = USB present
          in.vbat_mv = id(battery_voltage).state * 1000.0f;
          in.ichg_ma = id(charge_current).state;
          in.batt_pct = id(battery_level).state;
          id(tc_display_on) = id(oled).is_on();
          in.level = id(display_level).state;
          in.ble = id(ble).is_active();
          auto idx = id(hc_model).active_index();
          in.measured = !idx.has_value() || *idx == 1;  // no value yet -> Measured
          in.heat.a6 = id(hc_a6).state;
          in.heat.a1 = id(hc_a1).state;
          in.heat.tau_d1 = id(hc_tau_d1).state;
          in.heat.tau_d2 = id(hc_tau_d2).state;
          in.heat.a_bt = id(hc_a_bt).state;
          in.heat.tau_bt = id(hc_tau_bt).state;
          in.heat.bt_comp = id(hc_bt_comp).state;
          in.bright_target = id(tc_display_on) ? 100 : 0;  // on/off only, not "Display brightness"
          const float toff = id(tc_temp_offset).state, rhoff = id(tc_rh_offset).state;
          in.cal.t_off_c100 = std::isnan(toff) ? 0 : (int) lroundf(toff * 100.0f);
          in.cal.rh_off_d10 = std::isnan(rhoff) ? 0 : (int) lroundf(rhoff * 10.0f);
          const bool ok = tc.tick(in, id(tc_saved), &id(tc_heat_saved));
          const auto &st = tc.state();
          if (ok && !was_ready)
            ESP_LOGI("tcomp", "start: %s on=%d chg=%d cst=%d bacc=%d, heat %s (raw %.2f C)",
                     id(tc_saved).magic == tcomp::SAVED_MAGIC ? "restored" : "cold",
                     st.on, st.chg, st.cst, st.bacc, tc.heat_restored() ? "restored" : "seeded", in.t_raw);
          if (!tc.ready() && tc.ticks() == 60)
            ESP_LOGW("tcomp", "no SHT4x reading after 60 s: compensated T/RH unavailable");
          if (tc.ticks() % 10 == 0) {
            if (ok) {
              id(temp_comp).publish_state(tc.out().t);
              id(rh_comp).publish_state(tc.out().rh);
              id(hc_display_heat).publish_state(tc.display_heat());
              id(hc_bt_heat).publish_state(tc.bt_heat());
            } else if (!std::isnan(id(temp_comp).state)) {
              id(temp_comp).publish_state(NAN);
              id(rh_comp).publish_state(NAN);
              id(hc_display_heat).publish_state(NAN);
              id(hc_bt_heat).publish_state(NAN);
            }
          }
          if (ok && tc.ticks() % 300 == 0) {
            id(tc_saved) = tc.snapshot();
            id(tc_heat_saved) = tc.heat_snapshot();
            ESP_LOGD("tcomp", "on=%d chg=%d dis=%d cst=%d bacc=%d H_d=%.2f H_bt=%.2f: raw %.2f C %.1f%% -> %.2f C %.1f%%",
                     st.on, st.chg, st.dis, st.cst, st.bacc, tc.display_heat(), tc.bt_heat(),
                     in.t_raw, in.rh_raw, tc.out().t, tc.out().rh);
          }

# --- On-board OLED (components/cgdn1_display) ---------------------------------------
# 128x160 GUI, driven exactly like stock 4.8.5. Two factory panel variants, picked like stock
# from the "lcd id" byte at flash 0x3d205d (1 = variant B, 4-bpp grayscale @ 8 MHz, tested;
# anything else = variant A, 1-bpp SH1108-style @ 2 MHz, untested on hardware). HSPI mode 0, SCLK=5 MOSI=4, CS=15 / DC=2 / RST=22 as
# GPIOs (stock: spics_io_num=-1). The SPI clock follows the variant.
# GPIO2/5/15 are strapping pins; stock uses them for the OLED too (only sampled at reset).
spi:
  id: oled_spi
  interface: hardware
  clk_pin:
    number: GPIO5
    ignore_strapping_warning: true
  mosi_pin: GPIO4


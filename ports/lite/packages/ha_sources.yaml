# These native configuration entities belong to the physical ESPHome device.
# An empty entity ID selects that physical measurement; unavailable/malformed/
# stale HA input falls back independently. No helper creation or migration.
# This changes DISPLAY inputs only: exported CO2/T/RH/PM and PM guards always
# consume physical sensors, preventing feedback into HA room aggregates.
api:
  on_client_disconnected:
    - lambda: cgdn1_ha::sources.clear_values();

switch:
  - platform: template
    id: ha_values_enabled
    name: "Use Home Assistant display values"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: cgdn1_ha::sources.set_enabled(true);
    on_turn_off:
      - lambda: cgdn1_ha::sources.set_enabled(false);

text:
  - platform: cgdn1_ha_sources
    id: ha_co2_entity
    name: "CO2 display source"
    entity_category: config
    on_value:
      - lambda: cgdn1_ha::sources.configure(0, x);
  - platform: cgdn1_ha_sources
    id: ha_temperature_entity
    name: "Temperature display source"
    entity_category: config
    on_value:
      - lambda: cgdn1_ha::sources.configure(1, x);
  - platform: cgdn1_ha_sources
    id: ha_humidity_entity
    name: "Humidity display source"
    entity_category: config
    on_value:
      - lambda: cgdn1_ha::sources.configure(2, x);
  - platform: cgdn1_ha_sources
    id: ha_pm1_entity
    name: "PM1 display source"
    entity_category: config
    on_value:
      - lambda: cgdn1_ha::sources.configure(3, x);
  - platform: cgdn1_ha_sources
    id: ha_pm25_entity
    name: "PM25 display source"
    entity_category: config
    on_value:
      - lambda: cgdn1_ha::sources.configure(4, x);
  - platform: cgdn1_ha_sources
    id: ha_pm10_entity
    name: "PM10 display source"
    entity_category: config
    on_value:
      - lambda: cgdn1_ha::sources.configure(5, x);

text_sensor:
  - platform: template
    name: "HA display sources status"
    entity_category: diagnostic
    update_interval: 5s
    lambda: return cgdn1_ha::sources.diagnostic();

interval:
  - interval: 1s
    then:
      - lambda: cgdn1_ha::sources.loop();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="qingping-page-nonce" content="__PAGE_NONCE__">
<title>Qingping USB</title><link rel="stylesheet" href="style.css">
<script type="module" src="app.mjs"></script>
</head>
<body><main>
<header><h1>Qingping USB</h1><label><span data-text="language"></span>
<select id="language"><option value="en">English</option><option value="ru">Русский</option></select></label></header>
<p class="muted" data-text="intro"></p>
<section aria-labelledby="prepare"><h2 id="prepare" data-text="prepare"></h2>
<ol><li data-text="enable"></li><li data-text="cable"></li></ol>
<p class="note" data-text="boundary"></p></section>
<section aria-labelledby="where"><h2 id="where" data-text="where"></h2>
<label for="transport" data-text="transport"></label>
<select id="transport" aria-describedby="transport-help">
<option value="browser" data-text="computer"></option><option value="ha" data-text="server"></option>
</select><p id="transport-help" class="muted"></p>
<div id="ha-picker" hidden><button id="scan" class="secondary" data-text="scan"></button>
<label for="device" data-text="device"></label><select id="device"></select></div>
<button id="inspect" data-text="inspect"></button>
<button id="capture" class="secondary" data-text="capture"></button>
<p class="muted" data-text="capture_help"></p>
<progress id="capture-progress" max="9" hidden></progress>
<p id="status" role="status" aria-live="polite"></p>
<p id="error" role="alert"></p><dl id="identity"></dl>
</section>
<section aria-labelledby="prepare-install"><h2 id="prepare-install" data-text="prepare_install"></h2>
<label for="friendly-name" data-text="friendly_name"></label>
<input id="friendly-name" value="Qingping CGS1" maxlength="120" aria-describedby="preparation-help">
<p id="preparation-help" class="muted" data-text="preparation_help"></p>
<button id="prepare-profile" data-text="prepare_profile"></button>
<button id="preparation-status" class="secondary" data-text="check_preparation" hidden></button>
<p id="preparation-result" role="status" aria-live="polite"></p>
<button id="refresh-jobs" class="secondary" data-text="refresh_preparations"></button>
<label id="saved-job-label" for="saved-job" data-text="saved_preparations" hidden></label>
<select id="saved-job" hidden></select>
<div id="build-controls" hidden>
<p class="muted" data-text="build_help"></p>
<button id="build-firmware" data-text="build_firmware"></button>
<button id="build-status" class="secondary" data-text="check_build"></button>
<p id="build-result" role="status" aria-live="polite"></p>
</div>
</section>
<p class="note" data-text="next"></p>
<p><a href="https://github.com/ivaschru/qingping-esphome/blob/main/ports/monitor1/USB_TRIAL.md"
target="_blank" rel="noreferrer" data-text="docs"></a></p>
</main></body></html>
